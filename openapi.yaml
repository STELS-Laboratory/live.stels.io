    # ═══════════════════════════════════════════════════════════════════════════
    # TRADING SCHEMAS
    # ═══════════════════════════════════════════════════════════════════════════
    
    Symbol:
      type: string
      pattern: "^[A-Z0-9]+/[A-Z0-9]+$"
      example: "BTC/USDT"

    OrderSide:
      type: string
      enum: [buy, sell]

    OrderType:
      type: string
      enum: [market, limit, stop, stop_limit, trailing_stop, take_profit, take_profit_limit]

    OrderStatus:
      type: string
      enum: [pending, open, partial, filled, cancelled, rejected, expired]

    TimeInForce:
      type: string
      enum: [GTC, IOC, FOK, GTD, PO]
      description: |
        - GTC: Good Till Cancelled
        - IOC: Immediate Or Cancel
        - FOK: Fill Or Kill
        - GTD: Good Till Date
        - PO: Post Only

    Order:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        accountId:
          $ref: '#/components/schemas/UUID'
        exchangeOrderId:
          type: string
        symbol:
          $ref: '#/components/schemas/Symbol'
        side:
          $ref: '#/components/schemas/OrderSide'
        type:
          $ref: '#/components/schemas/OrderType'
        status:
          $ref: '#/components/schemas/OrderStatus'
        price:
          type: number
        amount:
          type: number
        filled:
          type: number
        remaining:
          type: number
        cost:
          type: number
        average:
          type: number
        stopPrice:
          type: number
        timeInForce:
          $ref: '#/components/schemas/TimeInForce'
        fee:
          type: object
          properties:
            cost:
              type: number
            currency:
              type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    CreateOrderParams:
      type: object
      required:
        - nid
        - symbol
        - type
        - side
        - amount
      properties:
        nid:
          type: string
          description: Account NID (exchange identifier)
        symbol:
          $ref: '#/components/schemas/Symbol'
        type:
          $ref: '#/components/schemas/OrderType'
        side:
          $ref: '#/components/schemas/OrderSide'
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
        price:
          type: number
          description: Required for limit orders
        stopPrice:
          type: number
          description: Required for stop orders
        timeInForce:
          $ref: '#/components/schemas/TimeInForce'
        reduceOnly:
          type: boolean

    CreateOrderResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Order'
        error:
          type: string

    CancelOrderParams:
      type: object
      required:
        - nid
        - orderId
      properties:
        nid:
          type: string
        orderId:
          type: string
        symbol:
          $ref: '#/components/schemas/Symbol'

    GetOrderParams:
      type: object
      required:
        - nid
        - orderId
      properties:
        nid:
          type: string
        orderId:
          type: string
        symbol:
          $ref: '#/components/schemas/Symbol'

    ListOrdersParams:
      type: object
      required:
        - nid
      properties:
        nid:
          type: string
        symbol:
          $ref: '#/components/schemas/Symbol'
        status:
          $ref: '#/components/schemas/OrderStatus'
        since:
          $ref: '#/components/schemas/Timestamp'
        limit:
          type: integer

    ListTradesParams:
      type: object
      required:
        - nid
      properties:
        nid:
          type: string
        symbol:
          $ref: '#/components/schemas/Symbol'
        since:
          $ref: '#/components/schemas/Timestamp'
        limit:
          type: integer

    Trade:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        symbol:
          $ref: '#/components/schemas/Symbol'
        side:
          $ref: '#/components/schemas/OrderSide'
        price:
          type: number
        amount:
          type: number
        cost:
          type: number
        fee:
          type: object
          properties:
            cost:
              type: number
            currency:
              type: string
        timestamp:
          $ref: '#/components/schemas/Timestamp'

    GetOrderBookParams:
      type: object
      required:
        - nid
        - symbol
      properties:
        nid:
          type: string
        symbol:
          $ref: '#/components/schemas/Symbol'
        limit:
          type: integer
          default: 20

    OrderBook:
      type: object
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        bids:
          type: array
          items:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
        asks:
          type: array
          items:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
        timestamp:
          $ref: '#/components/schemas/Timestamp'

    GetTickerParams:
      type: object
      required:
        - nid
        - symbol
      properties:
        nid:
          type: string
        symbol:
          $ref: '#/components/schemas/Symbol'

    Ticker:
      type: object
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        last:
          type: number
        bid:
          type: number
        ask:
          type: number
        high:
          type: number
        low:
          type: number
        volume:
          type: number
        change:
          type: number
        changePercent:
          type: number
        timestamp:
          $ref: '#/components/schemas/Timestamp'

    GetBalanceParams:
      type: object
      required:
        - nid
      properties:
        nid:
          type: string

    Balance:
      type: object
      properties:
        currency:
          type: string
        free:
          type: number
        used:
          type: number
        total:
          type: number

    BalanceResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Balance'

    # ═══════════════════════════════════════════════════════════════════════════
    # ACCOUNT SCHEMAS
    # ═══════════════════════════════════════════════════════════════════════════
    
    AccountType:
      type: string
      enum: [exchange, iot_hub, drone_controller, social_network, email, webhook, database, cloud, custom]

    AccountStatus:
      type: string
      enum: [active, inactive, error, pending_verification]

    AccountProvider:
      type: string
      enum:
        - binance
        - bybit
        - okx
        - coinbase
        - kraken
        - kucoin
        - gate
        - bitget
        - twitter
        - telegram
        - discord
        - slack
        - mqtt
        - home-assistant
        - tuya
        - smartthings
        - mavlink
        - dji
        - github
        - gitlab
        - kubernetes
        - docker
        - aws
        - gcp
        - azure
        - webhook
        - http
        - custom

    PermissionScope:
