        accountId:
          $ref: '#/components/schemas/UUID'
        grantedScopes:
          type: array
          items:
            $ref: '#/components/schemas/PermissionScope'
        limits:
          type: object

    UnlinkAgentFromAccountParams:
      type: object
      required:
        - agentId
