    # KNOWLEDGE BASE SCHEMAS
    # ═══════════════════════════════════════════════════════════════════════════
    
    KnowledgeBaseStatus:
      type: string
      enum: [ready, indexing, error]

    KnowledgeBase:
      allOf:
