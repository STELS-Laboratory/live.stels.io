        name:
          type: string
        type:
          $ref: '#/components/schemas/AccountType'
        provider:
          type: string
        credentials:
          $ref: '#/components/schemas/PlainCredentials'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionScope'
        metadata:
          type: object

    ConnectAccountResponse:
      type: object
      properties:
