    RouteToAgentsParams:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        agentIds:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
        domain:
          $ref: '#/components/schemas/AgentDomain'
        context:
          type: object
        waitForAll:
          type: boolean
        timeout:
          type: integer

    RouteToAgentsResponse:
      type: object
      properties:
        success:
          type: boolean
        responses:
          type: array
          items:
            type: object
            properties:
              agentId:
                $ref: '#/components/schemas/UUID'
              success:
                type: boolean
              response:
                type: string
              error:
                type: string
              duration:
                type: integer
        error:
          type: string

    CollaborationType:
      type: string
      enum: [sequential, parallel, hierarchical, peer]
      description: Agent collaboration type

    StartCollaborationParams:
      type: object
      required:
        - name
        - agentIds
        - type
      properties:
        name:
          type: string
          description: Collaboration name
        agentIds:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          minItems: 2
          description: Agent IDs to include in collaboration
        type:
          $ref: '#/components/schemas/CollaborationType'
        context:
          type: object
          description: Initial context for collaboration

    StartCollaborationResponse:
      type: object
      properties:
        success:
          type: boolean
        collaborationId:
          $ref: '#/components/schemas/UUID'
        error:
          type: string

    EndCollaborationParams:
      type: object
      required:
        - collaborationId
      properties:
        collaborationId:
          $ref: '#/components/schemas/UUID'
        reason:
          type: string

    SendAgentMessageParams:
      type: object
      required:
        - fromAgentId
        - toAgentId
        - content
      properties:
        fromAgentId:
          $ref: '#/components/schemas/UUID'
        toAgentId:
          $ref: '#/components/schemas/UUID'
        type:
          type: string
          enum: [request, response, notification, event]
        content:
          type: string
        metadata:
          type: object

    OrchestratorStats:
      type: object
      properties:
        success:
          type: boolean
        stats:
          type: object
          properties:
            activeInstances:
              type: integer
            totalMessages:
              type: integer
            activeCollaborations:
              type: integer

