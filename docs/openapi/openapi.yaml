    ListTradesParams:
      type: object
      required:
        - nid
      properties:
        nid:
          type: string
        symbol:
          $ref: "#/components/schemas/Symbol"
        since:
          $ref: "#/components/schemas/Timestamp"
        limit:
          type: integer

    Trade:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        symbol:
          $ref: "#/components/schemas/Symbol"
        side:
          $ref: "#/components/schemas/OrderSide"
        price:
          type: number
        amount:
          type: number
        cost:
          type: number
        fee:
          type: object
          properties:
            cost:
              type: number
            currency:
              type: string
        timestamp:
          $ref: "#/components/schemas/Timestamp"

    GetOrderBookParams:
      type: object
      required:
        - nid
        - symbol
      properties:
        nid:
          type: string
        symbol:
          $ref: "#/components/schemas/Symbol"
        limit:
          type: integer
