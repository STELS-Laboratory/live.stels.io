        symbol:
          $ref: "#/components/schemas/Symbol"
        type:
          $ref: "#/components/schemas/OrderType"
        side:
          $ref: "#/components/schemas/OrderSide"
        amount:
          type: number
          minimum: 0.00000001
          description: Order amount (must be greater than 0)
        price:
          type: number
          description: Required for limit orders
        stopPrice:
          type: number
          description: Required for stop orders
        timeInForce:
          $ref: "#/components/schemas/TimeInForce"
        reduceOnly:
          type: boolean

    CreateOrderResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/Order"
        error:
          type: string

    CancelOrderParams:
      type: object
