          $ref: "#/components/schemas/Symbol"
        bids:
          type: array
          items:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
        asks:
          type: array
          items:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
        timestamp:
          $ref: "#/components/schemas/Timestamp"

    GetTickerParams:
      type: object
      required:
        - nid
        - symbol
      properties:
        nid:
          type: string
        symbol:
          $ref: "#/components/schemas/Symbol"

    Ticker:
      type: object
      properties:
        symbol:
          $ref: "#/components/schemas/Symbol"
        last:
          type: number
        bid:
          type: number
        ask:
          type: number
        high:
          type: number
        low:
          type: number
        volume:
          type: number
        change:
          type: number
        changePercent:
          type: number
        timestamp:
          $ref: "#/components/schemas/Timestamp"

    GetBalanceParams:
      type: object
      required:
        - nid
      properties:
        nid:
          type: string

    Balance:
      type: object
      properties:
        currency:
          type: string
          example: "USDT"
        free:
          type: number
          example: 10000.00
        used:
