    error:
      type: string
      nullable: true

CreateBatchOrdersResponse:
  type: object
  properties:
    success:
      type: boolean
    raw:
      type: object
      properties:
        total:
          type: integer
        successful:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            $ref: "#/BatchOrderResult"
        timestamp:
          $ref: "common.yaml#/Timestamp"

CreateConditionalOrderResponse:
  type: object
  properties:
    success:
      type: boolean
    raw:
      type: object
      properties:
        conditionalOrderId:
          type: string
        status:
          type: string
          enum: [pending, triggered, cancelled, expired]
        message:
          type: string
        timestamp:
          $ref: "common.yaml#/Timestamp"
