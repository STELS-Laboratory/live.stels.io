      type: object

FetchGreeksResponse:
  type: object
  properties:
    success:
      type: boolean
    raw:
      type: object
      properties:
        greeks:
          oneOf:
            - $ref: "#/Greeks"
            - type: array
              items:
                $ref: "#/Greeks"
        baseCurrency:
          type: string
        total:
          type: integer
        timestamp:
          $ref: "common.yaml#/Timestamp"
