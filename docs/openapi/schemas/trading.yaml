# ═══════════════════════════════════════════════════════════════════════════════
# PROFESSIONAL TRADING METHODS (v2.15.0)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Advanced trading endpoints for professional terminals with Bybit priority support.
# These methods support advanced order types, position management, and risk metrics.

# === Bybit-specific Types ===
PositionIdx:
  type: integer
  enum: [0, 1, 2]
  description: |
    Bybit position index for hedge mode:
    - 0: One-way mode
    - 1: Buy side (hedge mode)
    - 2: Sell side (hedge mode)

TriggerBy:
  type: string
  enum: [LastPrice, MarkPrice, IndexPrice]
  description: Price type for triggers (Bybit)

TpSlMode:
  type: string
  enum: [Full, Partial]
  description: |
    Take Profit / Stop Loss mode (Bybit):
    - Full: TP/SL for entire position
    - Partial: TP/SL for partial position

OrderFilter:
  type: string
  enum: [Order, StopOrder, tpslOrder]
  description: Order type filter for cancelAllOrders (Bybit)

StopOrderType:
  type: string
  enum: [stop_loss, take_profit, stop_loss_limit, take_profit_limit, trailing_stop]
  description: Type of stop/trigger order

MarginMode:
  type: string
  enum: [cross, isolated]
  description: Margin mode for futures trading

MarginAction:
  type: string
  enum: [add, reduce]
  description: Action for modifying position margin

MarketTypeOverride:
  type: string
  enum: [spot, linear, inverse, option]
  description: Market type override for the request

# === Order Management Schemas ===
EditOrderParams:
  type: object
  description: Edit an existing order (price, amount)
  required:
    - accountId
    - orderId
    - symbol
  properties:
    accountId:
      $ref: "common.yaml#/UUID"
    orderId:
      type: string
      description: Order ID to edit
    symbol:
      $ref: "#/Symbol"
    type:
      $ref: "#/OrderType"
    side:
      $ref: "#/OrderSide"
    amount:
      type: number
      description: New amount (optional)
    price:
      type: number
      description: New price (required for limit orders)
    positionIdx:
      $ref: "#/PositionIdx"

EditOrderResponse:
  type: object
  properties:
    success:
      type: boolean
    raw:
      type: object
      properties:
        orderId:
          type: string
        symbol:
          $ref: "#/Symbol"
        type:
          $ref: "#/OrderType"
        side:
          $ref: "#/OrderSide"
        amount:
          type: number
        price:
          type: number
        status:
          $ref: "#/OrderStatus"
        timestamp:
          $ref: "common.yaml#/Timestamp"

CancelAllOrdersParams:
  type: object
  description: Cancel all open orders for a symbol or all symbols
  required:
    - accountId
  properties:
    accountId:
      $ref: "common.yaml#/UUID"
    symbol:
      $ref: "#/Symbol"
      description: Optional - cancels all if not provided
    marketType:
      $ref: "#/MarketTypeOverride"
    orderFilter:
      $ref: "#/OrderFilter"
      description: Bybit-specific order filter

CancelAllOrdersResponse:
  type: object
  properties:
    success:
      type: boolean
    raw:
      type: object
      properties:
        canceledCount:
          type: integer
        canceledOrders:
          type: array
          items:
            $ref: "#/Order"
        symbol:
          $ref: "#/Symbol"
        timestamp:
