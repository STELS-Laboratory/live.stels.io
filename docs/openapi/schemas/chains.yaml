# Chain Schemas - Cross-domain task chains
# Part of STELS Agentic AI Platform OpenAPI Specification

StepType:
  type: string
  enum: [task, agent, condition, parallel, wait, notification]

ChainStepConfig:
  type: object
  properties:
    type:
      $ref: "#/StepType"
    taskId:
      $ref: "common.yaml#/UUID"
    agentId:
      $ref: "common.yaml#/UUID"
    actions:
      type: array
      items:
        $ref: "tasks.yaml#/Action"
    prompt:
      type: string
    condition:
      $ref: "tasks.yaml#/SimpleCondition"
    stepIds:
      type: array
      items:
        type: string
    duration:
      type: integer
    channel:
      type: string
    template:
      type: string
    timeout:
      type: integer

ChainStep:
  type: object
  required:
    - id
    - name
    - config
  properties:
    id:
      type: string
    name:
      type: string
    description:
      type: string
    config:
      $ref: "#/ChainStepConfig"
    dependencies:
      type: array
      items:
        type: object
        properties:
          stepId:
            type: string
          condition:
            type: string
            enum: [completed, success, failure, any]
          outputMapping:
            type: object
    continueOnError:
      type: boolean
      default: false

ChainStatus:
  type: string
  enum:
    - pending
    - running
    - paused
    - completed
    - failed
    - cancelled
  description: Chain execution status

Chain:
  allOf:
    - $ref: "common.yaml#/NamedEntity"
    - type: object
      properties:
        status:
          $ref: "#/ChainStatus"
        trigger:
          $ref: "tasks.yaml#/Trigger"
        steps:
          type: array
          items:
            $ref: "#/ChainStep"
        entryStepId:
          type: string
        timeout:
          type: integer
          default: 3600000
        maxConcurrentExecutions:
          type: integer
          default: 1
        lastExecutedAt:
          $ref: "common.yaml#/Timestamp"
        executionCount:
          type: integer

# Request/Response Schemas
CreateChainParams:
  type: object
  required:
    - name
    - ownerId
    - steps
  properties:
    name:
      type: string
    description:
      type: string
    ownerId:
      type: string
    steps:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          name:
            type: string
          taskId:
            type: string
          action:
            type: object
            properties:
              type:
                type: string
              config:
                type: object
          dependsOn:
            type: array
            items:
              type: string
          condition:
            type: object
          onSuccess:
            type: object
          onFailure:
            type: object
          timeout:
            type: integer
          retries:
            type: integer
    initialContext:
      type: object

CreateChainResponse:
  type: object
  properties:
    webfix:
      type: string
    success:
      type: boolean
    chain:
      $ref: "#/Chain"
    error:
      type: string

GetChainParams:
  type: object
  required:
    - chainId
  properties:
    chainId:
      $ref: "common.yaml#/UUID"

ListChainsParams:
  type: object
  properties:
    ownerId:
      type: string
    status:
      $ref: "#/ChainStatus"
    limit:
      type: integer
      default: 50
    offset:
      type: integer
      default: 0

ExecuteChainParams:
  type: object
  required:
    - chainId
  properties:
    chainId:
      $ref: "common.yaml#/UUID"
    context:
      type: object
    triggerData:
      type: object

ExecuteChainResponse:
  type: object
  properties:
    webfix:
      type: string
    success:
      type: boolean
    executionId:
      $ref: "common.yaml#/UUID"
    error:
      type: string

ChainExecutionStatus:
  type: string
  enum: [pending, running, completed, failed, cancelled, paused]

ChainExecution:
  type: object
  properties:
    id:
      $ref: "common.yaml#/UUID"
    chainId:
      $ref: "common.yaml#/UUID"
    status:
      $ref: "#/ChainExecutionStatus"
    triggeredBy:
      type: string
    context:
      type: object
    currentStepIds:
      type: array
      items:
        type: string
    startedAt:
      $ref: "common.yaml#/Timestamp"
    completedAt:
      $ref: "common.yaml#/Timestamp"
    duration:
      type: integer
    error:
      type: string
